[project]
name = "midea-cloud"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Control your Midea M-Smart appliances via cloud"
authors = [
{ name = "sususweet", email = "tyq9702@sina.com" },
{ name = "rokam", email = "lucas@mindello.com.br" },
{ name = "chemelli74", email = "simone.chemelli@gmail.com" }
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
"aiohttp>=3.14.5",
"pycryptodome>=3.24.1,<5",
]

[project.urls]
"Homepage" = "https://github.com/midea-lan/midea-cloud"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "setuptools",
]

[tool.uv-version]
# Source of truth for the uv version. All other version references must be derived from this value.
version = "0.13.9" # renovate: depName=uv datasource=pypi

[tool.setuptools.dynamic]
version = { attr = "mideacloud.version.__version__" }

[tool.setuptools.packages.find]
include = ["mideacloud*"]

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=mideacloud --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mideacloud"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.mypy]
files = ["mideacloud", "tests"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disallow_untyped_decorators = false

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"
